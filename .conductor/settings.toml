"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "make setup"
run_mode = "concurrent"

[scripts.run.test]
command = "make test"
available_in = ["local"]
default = true
icon = "test-tube"

[scripts.run.package]
command = "make app"
available_in = ["local"]
icon = "package"
