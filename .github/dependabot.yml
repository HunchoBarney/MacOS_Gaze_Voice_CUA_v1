# development/ holds vendored upstream source (cua-source) that moves only
# with its pin, so Dependabot ignores every dependency in its manifests,
# security updates included. Security updates for the app's own manifests
# (EyeTracking, CredentialService, e2e, spikes) keep working with no config.
# Security updates take settings only from a block whose directory matches
# the manifest's exactly, so these list each vendored directory instead of
# a glob or exclude-paths.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # GitHub Actions workflows in .github/workflows
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directories:
      - "/development/Jarvis/cua-source"
      - "/development/Jarvis/cua-source/docs"
      - "/development/Jarvis/cua-source/libs/cua-driver/examples/jev-use"
      - "/development/Jarvis/cua-source/libs/cua-driver/typescript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "uv"
    directories:
      - "/development/Jarvis/cua-source"
      - "/development/Jarvis/cua-source/libs/cua-driver/examples/jev-use"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "pip"
    directories:
      - "/development/Jarvis/cua-source"
      - "/development/Jarvis/cua-source/libs/cua-driver/examples/jev-use"
      - "/development/Jarvis/cua-source/libs/cua-driver/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "cargo"
    directories:
      - "/development/Jarvis/cua-source/libs/cua-driver/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
