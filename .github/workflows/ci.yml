name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.11.0'
      - name: Swift tests, tracker typecheck and Vitest
        run: make test

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.paths.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: paths
        name: Does this change touch packaging
        run: |
          if git diff --name-only HEAD^1 HEAD \
              | grep -qE '^(Makefile|Info\.plist|Package\.(swift|resolved)|scripts/|ThirdParty/|\.github/|EyeTracking/(package\.json|pnpm-lock\.yaml|vite\.config\.ts|electron/|scripts/))|\.entitlements$'; then
            echo package=true >> "$GITHUB_OUTPUT"
          else
            echo package=false >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: changes
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        needs.changes.outputs.package == 'true'
      )
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.11.0'
      - name: Build, stage and sign ad-hoc from source
        run: SIGN_IDENTITY=- make release
      - name: Check the packaged app
        run: |
          app="build/Jarvis.app"
          codesign --verify --deep --strict "$app"
          python3 scripts/check-packaged-tracker.py "$app"
          test "$app/Contents/Resources/CodexRuntime/codex" -ef "$app/Contents/Resources/CodexRuntime/bin/codex"
          test -z "$(find "$app/Contents/Resources/EyeTracker" -name '*.test.*' -not -path '*/node_modules/*' -print -quit)"
