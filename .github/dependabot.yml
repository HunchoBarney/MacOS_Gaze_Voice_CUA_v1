# Dependabot runs only security updates for app manifests; version-update PRs
# are off (open-pull-requests-limit: 0) except for GitHub Actions.
# development/** holds vendored upstream source (cua-source), which moves
# only with its pin, so Dependabot never scans it.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # GitHub Actions workflows in .github/workflows
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directories: ["/**"]
    exclude-paths: ["development/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "uv"
    directories: ["/**"]
    exclude-paths: ["development/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directories: ["/**"]
    exclude-paths: ["development/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "cargo"
    directories: ["/**"]
    exclude-paths: ["development/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
